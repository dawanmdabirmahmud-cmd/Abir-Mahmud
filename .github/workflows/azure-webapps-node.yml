# vote_counting_agent.py

class VoteCountingAgent:
    def __init__(self, candidates):
        self.candidates = set(candidates)
        self.votes = []
        self.voters = set()
        self.audit_log = []

    def validate_vote(self, vote):
        if "voter_id" not in vote or "candidate" not in vote:
            return False, "Missing fields"

        if vote["voter_id"] in self.voters:
            return False, "Duplicate vote"

        if vote["candidate"] not in self.candidates:
            return False, "Invalid candidate"

        return True, "Valid"

    def accept_vote(self, vote):
        valid, msg = self.validate_vote(vote)
        self.audit_log.append({"vote": vote, "status": msg})

        if valid:
            self.votes.append(vote)
            self.voters.add(vote["voter_id"])

        return valid, msg

    def count_votes(self):
        results = {}
        for vote in self.votes:
            candidate = vote["candidate"]
            results[candidate] = results.get(candidate, 0) + 1
        return results


# -----------------------------
# Demo
if __name__ == "__main__":
    # Define candidates
    candidates = ["Alice", "Bob", "Charlie"]

    # Create agent
    agent = VoteCountingAgent(candidates)

    # Sample votes
    votes = [
        {"voter_id": "V001", "candidate": "Alice"},
        {"voter_id": "V002", "candidate": "Bob"},
        {"voter_id": "V003", "candidate": "Charlie"},
        {"voter_id": "V001", "candidate": "Bob"},  # Duplicate
        {"voter_id": "V004", "candidate": "Dave"}  # Invalid
    ]

    # Accept votes
    for vote in votes:
        valid, msg = agent.accept_vote(vote)
        print(f"Vote {vote} -> {msg}")

    # Count votes
    print("\nFinal Vote Count:")
    print(agent.count_votes())

    # Audit log
    print("\nAudit Log:")
    for entry in agent.audit_log:
        print(entry)
# This workflow will build and push a node.js application to an Azure Web App when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure App Service web app.
# For instructions see https://docs.microsoft.com/en-us/azure/app-service/quickstart-nodejs?tabs=linux&pivots=development-environment-cli
#
# To configure this workflow:
#
# 1. Download the Publish Profile for your Azure Web App. You can download this file from the Overview page of your Web App in the Azure Portal.
#    For more information: https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions?tabs=applevel#generate-deployment-credentials
#
# 2. Create a secret in your repository named AZURE_WEBAPP_PUBLISH_PROFILE, paste the publish profile contents as the value of the secret.
#    For instructions on obtaining the publish profile see: https://docs.microsoft.com/azure/app-service/deploy-github-actions#configure-the-github-secret
#
# 3. Change the value for the AZURE_WEBAPP_NAME. Optionally, change the AZURE_WEBAPP_PACKAGE_PATH and NODE_VERSION environment variables below.
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: your-app-name    # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '20.x'                # set this to the node version to use

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: npm install, build, and test
      run: |
        npm install
        npm run build --if-present
        npm run test --if-present

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: .

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app

    - name: 'Deploy to Azure WebApp'
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
