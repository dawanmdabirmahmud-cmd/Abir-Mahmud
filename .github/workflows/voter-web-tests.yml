name: Voter Web Logic Tests
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/voter-web-tests.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/voter-web-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test vote engine with generated SQLite schema
        working-directory: web
        run: node --test tests/voting.test.mjs
